name: Build and Release Emailzen

on:
  push:
    tags:
      - 'v*' # Se déclenche à chaque tag de version (ex: v1.0.0)
  workflow_dispatch: # Permet le lancement manuel depuis l'onglet Actions

env:
  UV_PYTHON: '3.11' # Version cible pour uv
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1 # Désactive les animations Rich text destructrices en CI/CD
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Supprime l'avertissement de dépréciation de Node.js 20

jobs:
  release:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Un échec sur un OS n'annule pas l'autre
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            output_path: build/linux
            asset_name: emailzen-linux.tar.gz
            needs_linux_deps: true
          - os: windows-latest
            platform: windows
            output_path: build/windows
            asset_name: emailzen-windows.zip
            needs_linux_deps: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install Linux Dependencies
        if: matrix.needs_linux_deps
        shell: bash
        run: |
          sudo apt update --allow-releaseinfo-change
          # Extraction dynamique des dépendances système comme recommandé dans la doc officielle :
          LINUX_DEPS="$(uv run python -c 'from flet.utils.linux_deps import linux_dependencies; print(" ".join(linux_dependencies))')"
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          sudo apt-get clean

      - name: Flet Build App
        shell: bash
        run: |
          # Utilisation explicite du dossier source 'src' et forçage de la destination via '--output'
          uv run flet build ${{ matrix.platform }} src --output ${{ matrix.output_path }} --yes --verbose

      - name: Archive Linux Build
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          tar -czf ${{ matrix.asset_name }} -C ${{ matrix.output_path }} .

      - name: Archive Windows Build
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.output_path }}\*" -DestinationPath "${{ matrix.asset_name }}"

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}